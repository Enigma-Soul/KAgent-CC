name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "bin/**"
      - "extension/**"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "extension/**"
      - "package.json"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bundle capture hook
        run: bun build src/capture.mjs --format esm --outfile dist/capture.mjs

      - name: Bundle TUI
        run: bun build src/tui.mjs --format esm --outfile dist/tui.mjs

      - name: Verify CLI syntax
        run: node --check bin/kagent-cc.mjs && node --check src/installer.mjs && node --check dist/capture.mjs && node --check dist/tui.mjs

      - name: Upload dist artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kagent-cc-dist
          path: dist/

  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        if: github.event_name == 'push'
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kagent-vsix
          path: extension/*.vsix
          if-no-files-found: error
